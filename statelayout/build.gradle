plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'io.github.wangyuyan666'
version = '1.1.0'

android {
    namespace = 'com.objectlife.statelayout'
    compileSdk = 36

    defaultConfig {
        minSdk = 8
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.10.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'statelayout'

                pom {
                    name = 'StateLayout'
                    description = 'A lightweight Android View container for content, empty, loading, and error states.'
                    url = 'https://github.com/wangyuyan666/StateLayout'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }

                    developers {
                        developer {
                            id = 'wangyuyan666'
                            name = 'wangyuyan'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/wangyuyan666/StateLayout.git'
                        developerConnection = 'scm:git:ssh://github.com/wangyuyan666/StateLayout.git'
                        url = 'https://github.com/wangyuyan666/StateLayout'
                    }
                }
            }
        }
    }
}
